name: Feature request
description: Suggest an idea for Sutra
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or wish behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Sutra help?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea works without sending my data anywhere new
